name: Kdenlive pilot against PostProject main

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      postproject_ref:
        description: PostProject revision to build against
        required: false
        type: string
        default: main
  workflow_call:
    inputs:
      postproject_ref:
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  kdenlive:
    name: Kdenlive ${{ matrix.postproject }} PostProject
    runs-on: ubuntu-latest
    # The pinned Kdenlive needs KF6 >= 6.21 and Qt >= 6.10, newer than any
    # Ubuntu runner image provides.
    container: ghcr.io/archlinux/archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        postproject: [with, without]
    steps:
      - name: Install Kdenlive build dependencies
        run: |
          pacman -Syu --noconfirm --needed git base-devel cmake ninja extra-cmake-modules rust python-pip uv
          # Arch's own Kdenlive package lists its runtime libraries; the
          # development files ship with them.
          pacman -S --noconfirm --needed $(pacman -Si kdenlive | sed -n 's/^Depends On *: //p')
      - uses: actions/checkout@v7
        with:
          repository: postproject-org/postproject-kdenlive
      - uses: actions/checkout@v7
        if: matrix.postproject == 'with'
        with:
          repository: postproject-org/postproject
          ref: ${{ inputs.postproject_ref || 'main' }}
          path: postproject
      - uses: actions/checkout@v7
        if: matrix.postproject == 'with'
        with:
          repository: postproject-org/postproject-blender
          path: postproject-blender
      - uses: actions/checkout@v7
        if: matrix.postproject == 'with'
        with:
          repository: postproject-org/postproject-openassetio-manager
          path: postproject-openassetio-manager
      - name: Build and install PostProject
        if: matrix.postproject == 'with'
        run: |
          cargo build --release --locked -p postproject-ffi --manifest-path postproject/Cargo.toml
          cmake -S postproject -B postproject/target/package \
            -DPOSTPROJECT_LIBRARY="$PWD/postproject/target/release/libpostproject.so" \
            -DPOSTPROJECT_STATIC_LIBRARY="$PWD/postproject/target/release/libpostproject.a" \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --install postproject/target/package
      - name: Apply the patch series to the pinned Kdenlive
        run: tools/checkout.sh
      - name: Build
        run: tools/build.sh ${{ matrix.postproject == 'with' && 'install' || 'none' }}
      - name: Test
        if: matrix.postproject == 'with'
        run: |
          mkdir -p evidence
          POSTPROJECT_ABI_TRACE="$PWD/evidence/kdenlive-abi.txt" tools/test.sh
          grep -R -q 'POSTPROJECT_TRY(' kdenlive/src
          grep -R -q 'POSTPROJECT_TRY_ASSIGN(' kdenlive/src
          grep -R -q 'pp::Result<' kdenlive/src
          printf '%s\n' 'Result<T>' 'POSTPROJECT_TRY' 'POSTPROJECT_TRY_ASSIGN' \
            > evidence/kdenlive-cpp.txt
      - name: Test without PostProject
        if: matrix.postproject == 'without'
        run: tools/test.sh
      - name: Test one shared production across maintained hosts
        if: matrix.postproject == 'with'
        run: |
          python postproject-blender/tools/fetch_blender.py 5.2.2 postproject-blender/blender
          postproject-blender/tools/dev.sh postproject-blender/blender/blender postproject
          echo "postproject @ file://$GITHUB_WORKSPACE/postproject/python" \
            > "$RUNNER_TEMP/postproject-override.txt"
          manager_venv="$RUNNER_TEMP/postproject-manager"
          uv venv --python 3.13 "$manager_venv"
          uv pip install --python "$manager_venv/bin/python" \
            --override "$RUNNER_TEMP/postproject-override.txt" \
            ./postproject/python ./postproject-openassetio-manager
          POSTPROJECT_ABI_TRACE_DIRECTORY="$PWD/evidence/shared-production" \
            tools/shared-production.sh \
            build \
            postproject-blender/blender/blender \
            postproject-blender/dist/postproject_relink-0.1.0-linux_x64.zip \
            postproject-blender \
            "$manager_venv/bin/python" \
            postproject-openassetio-manager \
            postproject/target/release/libpostproject.so
      - uses: actions/upload-artifact@v6
        if: matrix.postproject == 'with'
        with:
          name: kdenlive-postproject-usage
          path: evidence/
          if-no-files-found: error
